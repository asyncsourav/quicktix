
spring:
  profiles:
    active: dev
  application:
    name: quicktix
  cache:
    type: redis
  data:
    redis:
      timeout: 200ms
      connect-timeout: 200ms
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

# Centralized CORS Configuration (supports comma-separated list or yaml lists and env var CORS_ALLOWED_ORIGINS)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:8080}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Cookie,Set-Cookie
  exposed-headers: Authorization,Set-Cookie
  allow-credentials: true

# JWT and HttpOnly Refresh Cookie Settings
jwt:
  cookie-name: ${JWT_COOKIE_NAME:refreshToken}
  cookie-secure: ${JWT_COOKIE_SECURE:false} # false for local dev (HTTP), set to true in production (HTTPS)
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax} # Lax for localhost / same-site; None for cross-site with HTTPS


